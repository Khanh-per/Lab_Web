<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .card-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; flex: 1; text-align: center; box-shadow: 2px 2px 5px #eee; }
        .card h3 { margin: 0 0 10px 0; color: #555; }
        .number { font-size: 2em; font-weight: bold; color: #2c3e50; }
        .warning { color: red; }
    </style>
</head>
<body>
    <h1>📊 Product Dashboard</h1>
    <a th:href="@{/products}">Back to List</a>
    <hr>

    <div class="card-container">
        <div class="card">
            <h3>Total Products</h3>
            <div class="number" th:text="${totalProducts}">0</div>
        </div>
        <div class="card">
            <h3>Total Inventory Value</h3>
            <div class="number" th:text="${#numbers.formatCurrency(totalValue ?: 0)}">$0.00</div>
        </div>
        <div class="card">
            <h3>Average Price</h3>
            <div class="number" th:text="${#numbers.formatCurrency(avgPrice ?: 0)}">$0.00</div>
        </div>
    </div>

    <div style="display: flex; gap: 40px;">
        <div style="flex: 1;">
            <h2>Products by Category</h2>
            <ul>
                <li th:each="entry : ${categoryStats}">
                    <span th:text="${entry.key}">Category</span>: 
                    <strong th:text="${entry.value}">0</strong>
                </li>
            </ul>
        </div>

        <div style="flex: 1;">
            <h2 class="warning">⚠️ Low Stock Alerts (< 5)</h2>
            <table border="1" cellpadding="5" style="border-collapse: collapse; width: 100%;">
                <tr style="background: #f8d7da;">
                    <th>Name</th>
                    <th>Qty</th>
                    <th>Action</th>
                </tr>
                <tr th:each="p : ${lowStockProducts}">
                    <td th:text="${p.name}">Product</td>
                    <td th:text="${p.quantity}" style="font-weight:bold; color:red;">0</td>
                    <td><a th:href="@{/products/edit/{id}(id=${p.id})}">Restock</a></td>
                </tr>
            </table>
            <p th:if="${#lists.isEmpty(lowStockProducts)}">No stock alerts. Good job!</p>
        </div>
    </div>
</body>
</html>
